version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: saju_db
      POSTGRES_USER: saju_user
      POSTGRES_PASSWORD: saju_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saju_user -d saju_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
