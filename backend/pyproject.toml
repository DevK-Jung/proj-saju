[project]
name = "saju-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    # OpenAI
    "openai>=1.30.0",
    # 임베딩 (KURE-v1 로컬)
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    # 사주 계산
    "korean-lunar-calendar>=0.3.1",
    "ephem>=4.1.0",
    "pyswisseph>=2.10.0",
    # DB (비동기)
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "pgvector>=0.3.2",
    "alembic>=1.13.0",
    # LangGraph Checkpoint (PostgreSQL)
    "langgraph-checkpoint-postgres>=2.0.6",
    "psycopg[binary,pool]>=3.2.0",
    # Settings
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.2.1",
    # Utils
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
